<html>

  <head>
    <!-- load p5.js libraries -->
       <script type="text/javascript" src="./libraries/p5.min.js" ></script>
       <script type="text/javascript" src="./libraries/p5.dom.js" ></script>
       <script type="text/javascript" src="./libraries/p5.sound.js" ></script>

    <!-- load ml5.js for pitch detection -->
       <script type="text/javascript" src="https://unpkg.com/ml5@0/dist/ml5.min.js"></script>

    <!-- shared font + spacing for the UI controls -->
    <style>
      button, label {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
      }
      .controls {
        margin-bottom: 16px;
      }
      .controls label {
        margin-right: 12px;
      }
    </style>
  </head>

<body>

  <!-- create user interface -->
  <div class="controls">
    <button id="buttonStart">start/stop</button>
    <button id="buttonClear">clear</button>
  </div>

  <!-- toggles for each optional visual layer -->
  <div class="controls">
    <label><input type="checkbox" id="toggleColor" checked> pitch (color)</label>
    <label><input type="checkbox" id="togglePace" checked> pace (size)</label>
    <label><input type="checkbox" id="toggleRhythm" checked> rhythm (jitter)</label>
  </div>

    <!-- run p5.js script -->
    <div>
    <script type="text/javascript" src="./script.js"></script>
  </div>
  </body>

</html>
